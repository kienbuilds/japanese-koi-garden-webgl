<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <title>Hồ cá koi — vườn Nhật</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b120c; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #fps { position: fixed; left: 8px; top: 8px; font: 12px/1.3 ui-monospace, monospace; color: #cfe; background: rgba(0,0,0,.45); padding: 4px 6px; border-radius: 4px; display: none; z-index: 10; }
    #hint {
      position: fixed; right: 16px; bottom: 16px; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px 7px 9px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(12, 22, 14, .55); color: #e8f1e4;
      font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      cursor: pointer; user-select: none;
      box-shadow: 0 4px 18px rgba(0,0,0,.25);
      transition: opacity .6s ease, transform .2s ease, background .2s ease;
      animation: hint-in .8s ease-out both, hint-pulse 2.4s ease-in-out 1s 2;
    }
    #hint:hover { opacity: 1 !important; background: rgba(20, 38, 24, .78); transform: translateY(-1px); }
    #hint:focus-visible { outline: 2px solid #cfe8c4; outline-offset: 2px; }
    #hint.dim { opacity: .45; }
    #hint kbd {
      display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px;
      border-radius: 6px; background: rgba(255,255,255,.92); color: #1c2a1e;
      font: 700 12px/1 ui-monospace, monospace; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
    }
    @keyframes hint-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes hint-pulse { 50% { box-shadow: 0 0 0 6px rgba(207, 232, 196, .18), 0 4px 18px rgba(0,0,0,.25); } }
    @media (max-width: 520px) { #hint .label { display: none; } #hint { padding: 7px; } }
  </style>
</head>
<body>
  <div id="fps"></div>
  <button id="hint" type="button" title="Mở bảng tinh chỉnh (phím G)" aria-label="Mở bảng tinh chỉnh, phím tắt G">
    <kbd>G</kbd><span class="label">Bấm G để tinh chỉnh cảnh</span>
  </button>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
